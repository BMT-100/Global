<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Majid Askari Kochousangi — CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef4f8; --bg2:#e6f2f3; --card:#ffffff; --card-brd:#e6ebf0;
  --accent:#0891b2; --accent2:#4f46e5; --accent3:#059669; --accent4:#d97706; --accent5:#db2777;
  --txt:#0f1e2c; --txt-dim:#4a5b6b; --txt-dim2:#8393a1; --shadow:0 6px 24px -8px rgba(15,40,60,.10);
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
body{
  font-family:'Vazirmatn',sans-serif;
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(8,145,178,.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(79,70,229,.08), transparent 55%),
    linear-gradient(180deg, var(--bg1), var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--txt);
  min-height:100%;
  line-height:1.8;
  padding:18px 14px 60px;
}
@media(min-width:720px){ body{padding:32px 46px 70px;} }
.wrap{max-width:1120px; margin:0 auto;}

.topbar{display:flex; justify-content:flex-end; gap:8px; margin-bottom:18px;}
.lang-btn{
  background:#fff; border:1px solid var(--card-brd); color:var(--txt-dim);
  padding:8px 20px; border-radius:999px; font-family:inherit; font-size:14px; cursor:pointer;
  transition:.2s; font-weight:700; box-shadow:var(--shadow);
}
.lang-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;}

.header{
  display:flex; gap:28px; align-items:center; flex-wrap:wrap;
  background:linear-gradient(135deg,#ffffff,#f3f9fb); border:1px solid var(--card-brd); border-radius:28px;
  padding:30px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.header::before{
  content:""; position:absolute; inset:0; opacity:.7; pointer-events:none;
  background:radial-gradient(560px 240px at 92% -25%, rgba(8,145,178,.12), transparent 60%);
}
.avatar-ring{
  position:relative; width:136px; height:136px; flex:none; border-radius:50%;
  padding:5px; background:conic-gradient(from 210deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
  box-shadow:0 8px 26px -6px rgba(8,145,178,.35);
}
.avatar-ring img{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:4px solid #fff;}
.head-info{flex:1; min-width:260px; position:relative; z-index:1;}
.head-info h1{font-size:27px; font-weight:800; letter-spacing:.2px; color:#0b2436;}
.head-info .role{color:var(--accent); font-weight:700; font-size:15.5px; margin-top:7px;}
.head-info .sub{color:var(--txt-dim); font-size:13.8px; margin-top:5px;}
.contact-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
.contact-chip{
  display:flex; align-items:center; gap:7px; background:#fff;
  border:1px solid var(--card-brd); padding:8px 14px; border-radius:999px; font-size:13px; color:var(--txt-dim);
  box-shadow:0 2px 8px -4px rgba(15,40,60,.12);
}
.contact-chip svg{width:15px; height:15px; stroke:var(--accent); flex:none;}

.section{margin-top:36px;}
.section-title{display:flex; align-items:center; gap:11px; font-size:19.5px; font-weight:800; margin-bottom:16px; color:#0b2436;}
.section-title .ic{
  width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, rgba(8,145,178,.14), rgba(79,70,229,.14)); flex:none;
}
.section-title .ic svg{width:19px; height:19px; stroke:var(--accent);}
.section-title .bar{flex:1; height:1px; background:linear-gradient(90deg, var(--card-brd), transparent);}
.section-hint{color:var(--txt-dim2); font-size:13px; margin:-8px 0 16px;}

.card{background:#fff; border:1px solid var(--card-brd); border-radius:20px; padding:22px; box-shadow:var(--shadow);}
.summary-card p{color:var(--txt-dim); font-size:14.6px;}

/* capability icon-cards */
.cap-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px;}
.cap-card{
  background:#fff; border:1px solid var(--card-brd); border-radius:18px; padding:16px; box-shadow:var(--shadow);
  display:flex; gap:12px; align-items:flex-start; transition:transform .15s;
}
.cap-card:hover{transform:translateY(-3px);}
.cap-ic{width:42px; height:42px; border-radius:13px; flex:none; display:flex; align-items:center; justify-content:center;}
.cap-ic svg{width:21px; height:21px; stroke:#fff;}
.cap-txt .t{font-weight:800; font-size:14px; color:#0b2436;}
.cap-txt .d{color:var(--txt-dim2); font-size:12px; margin-top:3px; line-height:1.5;}

.ring-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px;}
.ring-card{
  background:#fff; border:1px solid var(--card-brd); border-radius:18px; padding:18px 10px;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; box-shadow:var(--shadow);
}
.ring-bg{fill:none; stroke:#eef2f5; stroke-width:9;}
.ring-fg{fill:none; stroke-width:9; stroke-linecap:round; stroke-dasharray:283; stroke-dashoffset:283; transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);}
.ring-wrap{position:relative; width:92px; height:92px;}
.ring-wrap svg{width:92px; height:92px; transform:rotate(-90deg);}
.ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#0b2436;}
.ring-label{font-size:12.5px; color:var(--txt-dim); font-weight:700; line-height:1.4;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
.stat-card{background:#fff; border:1px solid var(--card-brd); border-radius:18px; padding:20px 14px; text-align:center; box-shadow:var(--shadow);}
.stat-ic{width:38px; height:38px; border-radius:11px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, rgba(8,145,178,.14), rgba(79,70,229,.14));}
.stat-ic svg{width:19px; height:19px; stroke:var(--accent);}
.stat-num{font-size:26px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;}
.stat-lbl{font-size:12.5px; color:var(--txt-dim2); margin-top:4px;}

.timeline{position:relative; padding-inline-start:28px;}
.timeline::before{content:""; position:absolute; inset-inline-start:9px; top:6px; bottom:6px; width:2px;
  background:linear-gradient(var(--accent), var(--accent2), transparent);}
.tl-item{position:relative; margin-bottom:22px;}
.tl-item::before{content:""; position:absolute; inset-inline-start:-28px; top:8px; width:15px; height:15px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--accent), var(--accent2)); box-shadow:0 0 0 5px rgba(8,145,178,.13);}
.tl-card{background:#fff; border:1px solid var(--card-brd); border-radius:18px; padding:20px 22px; box-shadow:var(--shadow);}
.tl-card h3{font-size:16.5px; font-weight:800; color:#0b2436;}
.tl-card .role{color:var(--accent); font-size:13.8px; font-weight:700; margin-top:3px;}
.tl-card .meta{color:var(--txt-dim2); font-size:12.5px; margin-top:4px;}
.tl-card ul{margin-top:12px; padding-inline-start:18px; color:var(--txt-dim); font-size:13.6px;}
.tl-card li{margin-bottom:6px;}
.mini-tl{border-inline-start:2px solid var(--card-brd); padding-inline-start:16px; margin-top:6px;}
.mini-item{margin-bottom:12px;}
.mini-item .t{font-weight:700; font-size:14px; color:#0b2436;}
.mini-item .m{color:var(--txt-dim2); font-size:12.2px;}
.mini-item .d{color:var(--txt-dim); font-size:12.8px; margin-top:2px;}

.bar-list{display:flex; flex-direction:column; gap:14px;}
.bar-row .top{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px;}
.bar-row .top .n{font-weight:700; color:#0b2436;}
.bar-row .top .p{color:var(--accent); font-weight:800;}
.bar-track{height:9px; border-radius:999px; background:#eef2f5; overflow:hidden;}
.bar-fill{height:100%; border-radius:999px; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width 1.3s cubic-bezier(.2,.8,.2,1);}

/* tools grid with icons */
.tool-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px;}
.tool-chip{
  background:#fff; border:1px solid var(--card-brd); border-radius:16px; padding:14px 10px;
  display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; box-shadow:var(--shadow);
  transition:transform .15s;
}
.tool-chip:hover{transform:translateY(-3px);}
.tool-ic{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;}
.tool-ic svg{width:19px; height:19px; stroke:#fff;}
.tool-name{font-size:12px; font-weight:700; color:var(--txt-dim);}

.two-col{display:grid; grid-template-columns:1fr; gap:16px;}
@media(min-width:760px){.two-col{grid-template-columns:1fr 1fr;}}

.edu-card{display:flex; gap:14px; align-items:flex-start; background:#fff; border:1px solid var(--card-brd);
  border-radius:18px; padding:17px 19px; box-shadow:var(--shadow);}
.edu-ic{width:42px; height:42px; border-radius:13px; flex:none; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--accent3), #10b981);}
.edu-ic svg{width:21px; height:21px; stroke:#fff;}
.edu-card h4{font-size:14.8px; font-weight:800; color:#0b2436;}
.edu-card .meta{color:var(--txt-dim2); font-size:12.5px; margin-top:2px;}

.train-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.train-table th{color:var(--txt-dim2); font-weight:700; text-align:start; padding:9px 10px; font-size:12px; text-transform:uppercase; letter-spacing:.4px;}
.train-table td{padding:11px 10px; color:var(--txt-dim); border-top:1px solid var(--card-brd);}
.train-table tr td:first-child{color:#0b2436; font-weight:700;}

.chip-list{display:flex; flex-wrap:wrap; gap:10px;}
.soft-chip{display:flex; align-items:center; gap:8px; background:linear-gradient(135deg, rgba(79,70,229,.08), rgba(8,145,178,.08));
  border:1px solid rgba(79,70,229,.18); color:#312e81; padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700;}
.soft-chip svg{width:15px; height:15px; stroke:var(--accent2);}

footer{text-align:center; color:var(--txt-dim2); font-size:12px; margin-top:44px;}
::selection{background:rgba(8,145,178,.2);}
</style>
</head>

<div class="wrap">
  <div class="topbar">
    <button class="lang-btn active" id="btnFa" onclick="setLang('fa')">فارسی</button>

  <div class="section">

  <div class="section">

    <div class="cap-grid" id="capGrid"></div>
  </div>

  <div class="section">
    <div class="section-title"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div><span id="tCore"></span><div class="bar"></div></div>
    <div class="ring-grid" id="ringGrid"></div>
  </div>

  <div class="section">
    <div class="section-title"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div><span id="tExp"></span><div class="bar"></div></div>
    <div class="timeline" id="tlGrid"></div>
  </div>

  <div class="two-col">
    <div class="section" style="margin-top:0">
      <div class="section-title"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg></div><span id="tEdu"></span><div class="bar"></div></div>
      <div style="display:flex; flex-direction:column; gap:12px;" id="eduGrid"></div>
    </div>
    <div class="section" style="margin-top:0">
      <div class="section-title"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></svg></div><span id="tLang"></span><div class="bar"></div></div>

  <div class="section">

    <div class="tool-grid" id="toolGrid"></div>
  </div>

  <div class="section">
    <div class="section-title"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div><span id="tTrain"></span><div class="bar"></div></div>
    <div class="card" style="overflow-x:auto"><table class="train-table" id="trainTable"></table></div>
  </div>

  <div class="section">
    <div class="section-title"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><span id="tSoft"></span><div class="bar"></div></div>
    <div class="chip-list" id="softGrid"></div>
  </div>

  <footer id="footerTxt"></footer>
</div>

  handshake:'<path d="M2 12l4-4 4 3 3-3 3 3 4-4 2 2-3 8-5 3-3-2-3 2-5-3z"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'
};
function svgIcon(key){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[key]||ICONS.box)+'</svg>'; }
const PALETTE = ['#0891b2','#4f46e5','#059669','#d97706','#db2777','#7c3aed','#0d9488','#2563eb'];
function ringSVG(pct, idx){
  const off = 283 - (283*pct/100);
  const c = PALETTE[idx%PALETTE.length];
  return '<div class="ring-wrap"><svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="45"></circle>'+
    '<circle class="ring-fg" cx="50" cy="50" r="45" stroke="'+c+'" data-off="'+off+'"></circle></svg>'+
    '<div class="ring-num">'+pct+'%</div></div>';
}

function render(lang){
  const d = DATA[lang];
  document.getElementById('htmlRoot').setAttribute('lang', lang==='fa'?'fa':'en');
  document.getElementById('htmlRoot').setAttribute('dir', lang==='fa'?'rtl':'ltr');
  document.getElementById('btnFa').classList.toggle('active', lang==='fa');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');

  document.getElementById('hName').textContent = d.name;
  document.getElementById('hRole').textContent = d.role;
  document.getElementById('hSub').textContent = d.sub;
  document.getElementById('cPhone').textContent = d.phone;
  document.getElementById('cEmail').textContent = d.email;
  document.getElementById('cLoc').textContent = d.location;
  document.getElementById('tSummary').textContent = d.labels.summary;
  document.getElementById('pSummary').textContent = d.summary;
  document.getElementById('tCaps').textContent = d.labels.caps;
  document.getElementById('capsHint').textContent = d.labels.capsHint;
  document.getElementById('tCore').textContent = d.labels.core;
  document.getElementById('tExp').textContent = d.labels.exp;
  document.getElementById('tEdu').textContent = d.labels.edu;
  document.getElementById('tLang').textContent = d.labels.lang;
  document.getElementById('tTools').textContent = d.labels.tools;
  document.getElementById('tTrain').textContent = d.labels.train;
  document.getElementById('tSoft').textContent = d.labels.soft;
  document.getElementById('footerTxt').textContent = d.footer;

  document.getElementById('statGrid').innerHTML = d.stats.map(function(s,i){
    return '<div class="stat-card"><div class="stat-ic">'+svgIcon(s.icon)+'</div><div class="stat-num">'+s.n+'</div><div class="stat-lbl">'+s.l+'</div></div>';
  }).join('');

  document.getElementById('capGrid').innerHTML = d.capabilities.map(function(c,i){
    var col = PALETTE[i%PALETTE.length];
    return '<div class="cap-card"><div class="cap-ic" style="background:'+col+'">'+svgIcon(c.icon)+'</div>'+
      '<div class="cap-txt"><div class="t">'+c.t+'</div><div class="d">'+c.d+'</div></div></div>';
  }).join('');

  document.getElementById('ringGrid').innerHTML = d.skills.map(function(s,i){
    return '<div class="ring-card">'+ringSVG(s.pct,i)+'<div class="ring-label">'+s.name+'</div></div>';
  }).join('');

  document.getElementById('tlGrid').innerHTML = d.experience.map(function(e){
    var bullets = e.bullets ? '<ul>'+e.bullets.map(function(b){return '<li>'+b+'</li>';}).join('')+'</ul>' : '';
    var mini = e.mini ? '<div class="mini-tl">'+e.mini.map(function(m){
      return '<div class="mini-item"><div class="t">'+m.t+'</div><div class="m">'+m.m+'</div><div class="d">'+m.d+'</div></div>';
    }).join('')+'</div>' : '';
    return '<div class="tl-item"><div class="tl-card"><h3>'+e.company+'</h3><div class="role">'+e.role+'</div>'+
      '<div class="meta">'+e.period+(e.place? ' • '+e.place:'')+'</div>'+bullets+mini+'</div></div>';
  }).join('');

  document.getElementById('eduGrid').innerHTML = d.education.map(function(e){
    return '<div class="edu-card"><div class="edu-ic">'+svgIcon('award')+'</div>'+
      '<div><h4>'+e.deg+'</h4><div class="meta">'+e.period+'</div></div></div>';
  }).join('');

  document.getElementById('langGrid').innerHTML = d.languages.map(function(l){
    return '<div class="bar-row"><div class="top"><span class="n">'+l.name+'</span><span class="p">'+l.level+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" data-pct="'+l.pct+'"></div></div></div>';
  }).join('');

  document.getElementById('toolGrid').innerHTML = d.tools.map(function(t,i){
    var col = PALETTE[i%PALETTE.length];
    return '<div class="tool-chip"><div class="tool-ic" style="background:'+col+'">'+svgIcon(t.icon)+'</div><div class="tool-name">'+t.n+'</div></div>';
  }).join('');

  document.getElementById('trainTable').innerHTML =
    '<tr><th>'+d.labels.trainCourse+'</th><th>'+d.labels.trainOrg+'</th><th>'+d.labels.trainYear+'</th><th>'+d.labels.trainDur+'</th></tr>'+
    d.training.map(function(t){return '<tr><td>'+t.c+'</td><td>'+t.o+'</td><td>'+t.y+'</td><td>'+t.h+'</td></tr>';}).join('');

  document.getElementById('softGrid').innerHTML = d.soft.map(function(s){return '<div class="soft-chip">'+svgIcon(s.icon)+'<span>'+s.t+'</span></div>';}).join('');

  requestAnimationFrame(function(){
    setTimeout(function(){
      document.querySelectorAll('.ring-fg').forEach(function(el){ el.style.strokeDashoffset = el.dataset.off; });
      document.querySelectorAll('.bar-fill').forEach(function(el){ el.style.width = el.dataset.pct+'%'; });
    }, 80);
  });
}

function setLang(l){ try{ localStorage.setItem('cvLang', l); }catch(e){} render(l); }
var initLang = 'fa';
try{ initLang = localStorage.getItem('cvLang') || 'fa'; }catch(e){}
render(initLang);
</script>
</body>
</html>
