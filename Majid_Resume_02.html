<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef4f8"><title>مجید عسکری کوچوسنگی | Professional CV</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{
  --bg:#eef4f8;--bg2:#f7fafc;--panel:#ffffff;--panel-soft:#f4f8fb;--ink:#17324a;
  --muted:#698096;--accent:#087ea4;--accent-2:#11a8a0;--accent-3:#f19a4b;--accent-soft:#e8f6fa;
  --line:#dce8ef;--shadow:0 14px 45px rgba(30,67,92,.10);--shadow-sm:0 8px 24px rgba(30,67,92,.08);
  --radius:22px;--radius-sm:15px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Vazirmatn,Tahoma,Arial,sans-serif;background:
 radial-gradient(circle at 8% 4%,rgba(8,126,164,.08),transparent 23%),
 radial-gradient(circle at 94% 8%,rgba(241,154,75,.08),transparent 22%),
 linear-gradient(180deg,#eef4f8 0%,#f8fbfd 42%,#eef5f8 100%);color:var(--ink);line-height:1.9}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:
 linear-gradient(rgba(23,50,74,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(23,50,74,.025) 1px,transparent 1px);background-size:34px 34px}
.wrap{max-width:1380px;margin:0 auto;padding:20px 18px 64px}
.toolbar{position:sticky;top:12px;z-index:40;display:flex;gap:9px;justify-content:flex-start;flex-wrap:wrap;margin:0 0 14px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink);padding:9px 13px;border-radius:13px;cursor:pointer;font:inherit;font-size:12px;font-weight:700;box-shadow:var(--shadow-sm);backdrop-filter:blur(10px);transition:.2s ease}
.btn:hover{transform:translateY(-2px);border-color:#b9dce7;box-shadow:0 12px 28px rgba(30,67,92,.12)}
.btn.primary{background:linear-gradient(135deg,#e7f6fa,#f2fbfb);color:#086d88;border-color:#b9e5ec}
.lang-en{display:none}.show-en .lang-fa{display:none}.show-en .lang-en{display:block}
.hero{position:relative;overflow:hidden;padding:32px;border-radius:30px;background:linear-gradient(135deg,#bedbff 0%,#d5ebf6 58%,#eef8f7 100%);border:1px solid #d8e7ee;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;inset:auto -80px -130px auto;width:360px;height:360px;border-radius:50%;border:62px solid rgba(8,126,164,.06);box-shadow:0 0 0 46px rgba(17,168,160,.03),0 0 0 92px rgba(241,154,75,.025)}
.hero:before{content:"";position:absolute;left:-120px;top:-120px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(241,154,75,.13);box-shadow:0 0 0 38px rgba(241,154,75,.03),0 0 0 76px rgba(8,126,164,.022)}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:170px 1fr;gap:26px;align-items:center}
.avatar{width:170px;height:190px;border-radius:28px;object-fit:cover;object-position:center top;border:5px solid #fff;box-shadow:0 14px 36px rgba(30,67,92,.17)}
.kicker{font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--accent);font-weight:900;margin-bottom:5px}.name{font-size:clamp(30px,5vw,58px);font-weight:900;line-height:1.16;margin:0 0 8px;color:#153149}.title{font-size:clamp(14px,2vw,20px);color:#466278;max-width:1050px;font-weight:700}.contacts{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.contact{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;color:#415e73;box-shadow:0 5px 16px rgba(30,67,92,.05)}
.icon{width:22px;height:22px;display:inline-grid;place-items:center;color:var(--accent);flex:none}.icon svg{width:18px;height:18px;stroke:currentColor}
.section{margin-top:20px}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 13px;font-size:21px;font-weight:900;color:#17324a}.section-title .bar{width:8px;height:28px;border-radius:8px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}.section-title small{color:var(--muted);font-weight:600;font-size:11px}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(5,1fr)}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow-sm);backdrop-filter:blur(12px)}
.stat{position:relative;overflow:hidden;min-height:132px}.stat:before{content:"";position:absolute;right:-38px;top:-38px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#e8f7fa 0%,rgba(232,247,250,.12) 68%,transparent 70%)}
.stat .stat-icon{position:absolute;left:15px;top:14px;width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}.stat .num{font-size:38px;font-weight:900;letter-spacing:-.03em;margin-top:18px}.stat .label{color:#667d90;font-size:12px;margin-top:2px}.stat .sub{font-size:10px;color:#93a4b0;margin-top:5px}
.about{grid-template-columns:1.1fr 1fr}.lead{font-size:14px;color:#200157;margin:0}.accent-lead{border-right:4px solid var(--accent-2);padding-right:14px}
.cap-map{position:relative;padding:26px 18px 20px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:center}.flow-node{position:relative;padding:17px 12px;text-align:center;background:linear-gradient(180deg,#ffffff,#f7fbfc);border:1px solid #dbeaf0;border-radius:18px;box-shadow:0 8px 20px rgba(30,67,92,.06)}.flow-node strong{display:block;font-size:13px}.flow-node small{color:var(--muted);font-size:10px}.flow-arrow{font-size:23px;color:#8eb6c2;text-align:center;display:grid;place-items:center}
.domain-grid{grid-template-columns:repeat(4,1fr)}.domain{padding:18px}.domain-head{display:flex;gap:11px;align-items:center}.domain-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#e9f7fa,#effaf8);color:var(--accent);border:1px solid #d4edf1}.domain h3{margin:0;font-size:14px}.domain .count{font-size:11px;color:var(--muted)}
.progress{height:9px;background:#e9f0f4;border-radius:999px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 14px rgba(8,126,164,.18)}.progress-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-top:9px}.progress-row b{color:#21627a}
.ring-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.ring-card{display:flex;align-items:center;gap:14px}.ring{--p:75%;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),#e4edf2 0);display:grid;place-items:center;position:relative;flex:none}.ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff;border:1px solid var(--line)}.ring .inside{position:relative;text-align:center}.ring .big{font-size:22px;font-weight:900;display:block;color:#19364e}.ring .small{font-size:9px;color:var(--muted);display:block;max-width:60px;line-height:1.4;margin:auto}
.note{color:#8599a8;font-size:10px;margin-top:10px}.expert-grid{grid-template-columns:repeat(2,1fr)}.expert{min-height:220px}.expert h3{margin:0 0 4px;font-size:15px}.expert .domain-note{font-size:11px;color:var(--muted)}
.skill-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.skill-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e0ebf0;background:#fbfdfe;border-radius:12px;font-size:11px;color:#425f73;transition:.18s ease}.skill-item:hover{transform:translateY(-2px);border-color:#bddde6;box-shadow:0 7px 16px rgba(30,67,92,.06)}.skill-item .sicon{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#edf8fa;color:#087ea4;flex:none}.skill-item .sicon svg{width:15px;height:15px}
.timeline{position:relative;padding-right:24px}.timeline:before{content:"";position:absolute;right:7px;top:3px;bottom:3px;width:2px;background:linear-gradient(var(--accent),rgba(8,126,164,.08))}.job{position:relative;margin-bottom:16px;padding:20px}.job:before{content:"";position:absolute;right:-1px;top:24px;width:14px;height:14px;background:#fff;border:4px solid var(--accent);border-radius:50%;box-shadow:0 0 0 4px #dff2f5}.job-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.job h3{margin:0;font-size:17px;color:#1a3850}.job .meta{font-size:11px;color:var(--muted);margin-top:4px}.job .role{font-size:12px;color:#4a667a;margin-top:5px;font-weight:700}.job .overview{margin:12px 0 0}.details{margin-top:14px}.details details{border-top:1px solid #e7eef2;padding:12px 0}.details details:first-child{border-top:0}.details summary{list-style:none;cursor:pointer;color:#24556f;font-weight:900;font-size:12px;display:flex;align-items:center;gap:8px}.details summary::-webkit-details-marker{display:none}.details summary:before{content:"⌄";width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#eef7f8;color:var(--accent);font-weight:900;transition:.2s}.details details[open] summary:before{transform:rotate(180deg);background:#e6f6f8}.details ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px}.details li{font-size:12px;color:#506a7c;display:flex;gap:8px;align-items:flex-start;padding:6px 8px;background:#fbfdfe;border:1px solid #eaf1f4;border-radius:11px}.details li:before{content:"✓";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#ecf8f4;color:#1d8d79;font-size:10px;font-weight:900;flex:none;margin-top:1px}
.subjobs{grid-template-columns:repeat(2,1fr)}
.projects{grid-template-columns:repeat(3,1fr)}.project{position:relative;overflow:hidden}.project:after{content:"";position:absolute;left:-20px;bottom:-28px;width:90px;height:90px;border-radius:50%;background:#edf8fa}.project .picon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#eaf7f9;color:var(--accent);margin-bottom:11px}.project h3{margin:0 0 7px;font-size:14px}.project p{margin:0;color:#5a7182;font-size:12px}
.edu{grid-template-columns:1fr 1fr}.degree{display:flex;gap:13px;align-items:flex-start}.degree .badge{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#eaf7fa,#effaf8);border:1px solid #d7edf0;color:var(--accent);font-size:15px;font-weight:900}.degree h3{margin:0;font-size:14px}.degree p{margin:2px 0;color:var(--muted);font-size:11px}
.courses{grid-template-columns:repeat(4,1fr)}.course .name{font-size:14px;font-weight:800}.course .meta{color:var(--muted);font-size:10px}.course .tag{font-size:10px;color:var(--accent);font-weight:800;margin-bottom:8px}
.tool-groups{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.tool-card{padding:17px}.tool-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.tool-title{display:flex;align-items:center;gap:9px}.tool-title .domain-icon{width:38px;height:38px}.tool-title h3{margin:0;font-size:14px}.tool-count{font-size:10px;color:var(--muted);padding:5px 8px;border-radius:999px;background:#f3f8fa;border:1px solid #e1edf1}
.langs{grid-template-columns:1.1fr .9fr}.lang-card{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lang-item{padding:12px 14px;border-radius:16px;background:#fbfdfe;border:1px solid #e4edf1}.lang-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800}.meter{height:8px;margin-top:8px;background:#eaf0f4;border-radius:999px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-3),#f6c789);border-radius:inherit}.personal{grid-template-columns:repeat(2,1fr)}.personal .item{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:15px}.personal .item div{font-size:12px;color:#506a7c}
footer{margin-top:28px;text-align:center;color:#8295a3;font-size:10px}.footer-line{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
@media(max-width:1120px){.stats{grid-template-columns:repeat(3,1fr)}.domain-grid,.skill-grid{grid-template-columns:repeat(2,1fr)}.ring-grid{grid-template-columns:repeat(2,1fr)}.projects,.courses{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.wrap{padding:14px 10px 45px}.hero-grid{grid-template-columns:1fr;text-align:center}.avatar{margin:0 auto}.contacts{justify-content:center}.stats,.domain-grid,.skill-grid,.expert-grid,.projects,.courses,.tool-groups,.edu,.subjobs,.langs,.personal{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.flow-arrow{transform:rotate(90deg)}.ring-grid{grid-template-columns:1fr}.job-head{flex-direction:column}.name{font-size:32px}.hero{padding:23px!important}.card{border-top: 3px solid #646464; border-radius:18px;padding:16px}.section-title{font-size:18px}}
@media print{body{background:#fff!important;color:#17324a}.wrap{max-width:none;padding:0}.toolbar{display:none}.card,.hero{box-shadow:none;background:#fff;border:1px solid #d7e0e5}.section{break-inside:auto}.job,.project,.tool-card,.degree,.course{break-inside:avoid}.details details{break-inside:auto}footer{color:#555}.hero:after,.hero:before,body:before{display:none}}
